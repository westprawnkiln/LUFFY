name: Finalize TODO Sync

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fetch dev
        run: git fetch origin dev:refs/remotes/origin/dev
      - name: Verify README
        run: python .github/scripts/verify_todo.py
      - name: Close temporary PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr close 1 --repo westprawnkiln/LUFFY --comment "Temporary comparison completed; closing without merging." || true
      - name: Delete temporary branch
        run: git push origin --delete todo-sync-runner || true
      - name: Restore main
        run: git push --force origin 266cbc22215201a93c02e37200fe32be98a9e931:refs/heads/main
