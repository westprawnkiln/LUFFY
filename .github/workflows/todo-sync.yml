name: Sync Complete TODO List

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the README update to dev
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: todo-sync-runner
          fetch-depth: 0
      - name: Fetch main and dev
        run: git fetch origin main:refs/remotes/origin/main dev:refs/remotes/origin/dev
      - name: Validate TODO extraction and optionally update README
        env:
          APPLY: ${{ inputs.apply }}
        run: python .github/scripts/todo_sync.py
